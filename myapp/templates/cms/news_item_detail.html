{% extends "cms/kuam.html" %}

{% block content %}
<main class="news-page news-detail-page">
    <div class="news-detail-page__inner">
        <a class="news-detail-page__back" href="{% url 'sdg_page' %}#news">← К новостям ЦУР</a>

        <article class="news-detail-card">
            <h1 class="news-detail-page__title">{{ news.display_title }}</h1>

            {% if news.sdg_tags %}
                <div class="news-sdg">
                    <span class="news-sdg__label">Вклад в ЦУР:</span>
                    {% for tag in news.sdg_tags %}
                        <a
                            class="news-sdg__badge"
                            href="{% url 'sdg_page' %}?goal={{ tag.number }}#goals"
                            title="ЦУР {{ tag.number }} — {{ tag.name }}"
                            style="--sdg-color: {{ tag.color }};"
                        >ЦУР {{ tag.number }}</a>
                    {% endfor %}
                </div>
            {% endif %}

            <div class="news-content">{{ news.display_content|safe }}</div>
            <time class="news-date" datetime="{{ news.created_at|date:'c' }}">
                {{ news.created_at }}
            </time>
        </article>
    </div>
</main>
{% endblock %}
