{% extends "cms/kuam.html" %}
{% block content %}
<div class="container-fluid" data-bootstrap-contains="containers">
    <br>
<br>
<br>
<br>
<br>
    <div class="table-background">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="grid-container" id="teacherGrid">
                        {% for item in meropriatia %}
                            {% if item.is_active %}
                                <div class="profile-card">

                                    <!-- Заголовок карточки -->
                                    <div class="{{ item.css_class }} toggleDropdown"
                                         data-ru="{{ item.title_ru }}"
                                         data-kk="{{ item.title_kk }}"
                                         data-en="{{ item.title_en }}">
                                        {{ item.title_ru }}
                                        <span class="arrow">▼</span>
                                    </div>
                                    <div class="info" data-ru="{{ item.summary_ru }}"
                                         data-kk="{{ item.summary_kk }}"
                                         data-en="{{ item.summary_en }}">
                                        {{ item.summary_ru|safe }}
                                    </div>
                                </div>
                            {% endif %}
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>
    <br>
<br>
<br>
<br>
<br>
    <br>
<br>
<br>
<br>
</div>
<style type="text/css">
.nav-menu {
  padding: 0 120px;
  margin-bottom: 1.2em;
  list-style: none;
}
.grid-container {
  display: flex;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 22px;

  max-height: none;
  overflow: visible;
  opacity: 1;
  flex-wrap: wrap;
}

.grid-container.active {
  max-height: 5000px;
  opacity: 1;
}
.container-fluid[data-bootstrap-contains="containers"] {
  min-height: 100vh;
  padding: 56px 0;
  display: flex;
  align-items: center;
  background-image:
    linear-gradient(135deg, rgba(15, 23, 42, 0.78), rgba(37, 99, 235, 0.42)),
    url('/media/uploads/bg_science.jpg');
  background-size: cover;
  background-repeat: no-repeat;
  background-position: center top;
}

.table-background {
  width: min(1180px, 88%);
  margin: 0 auto;
  padding: 34px;
  border-radius: 30px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(255, 255, 255, 0.55);
  box-shadow: 0 28px 80px rgba(15, 23, 42, 0.26);
  backdrop-filter: blur(18px);
}

.arrow {
  margin-left: 10px;
  display: inline-block;
  transition: transform 0.3s ease;
}

.profile-card {
  padding: 22px;
  border-radius: 26px;
  background: linear-gradient(180deg, #ffffff, #f6f9ff);
  border: 1px solid rgba(226, 232, 240, 0.9);
  box-shadow: 0 14px 35px rgba(15, 23, 42, 0.1);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.profile-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
}

.photo {
  width: 104px;
  height: 104px;
  border-radius: 28px;
  overflow: hidden;
  flex-shrink: 0;
  margin-bottom: 16px;
  box-shadow: 0 14px 30px rgba(37, 99, 235, 0.22);
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.info {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, opacity 0.3s ease;
}

.info.active {
  max-height: 1000px;
  opacity: 1;
  overflow-y: auto;
  padding: 0 30px;
}

.toggleDropdown.open .arrow {
  transform: rotate(180deg);
}

.name {
  margin: 0 0 6px;
  font-size: 18px;
  font-weight: 800;
  color: #0f172a;
}

.desc {
  margin-bottom: 6px;
  font-size: 14px;
  color: #475569;
  line-height: 1.55;
}

.email {
  font-size: 14px;
  font-weight: 600;
  color: #2563eb;
  text-decoration: none;
}

.email:hover {
  text-decoration: underline;
}

.icons {
  margin-top: 10px;
  display: flex;
  gap: 10px;
  align-items: center;
}

.icons img {
  height: 20px;
  opacity: 0.72;
  transition: transform 0.2s ease, opacity 0.2s ease;
}

.icons img:hover {
  opacity: 1;
  transform: translateY(-2px);
}

.dropdown-label {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
  padding: 12px 18px;
  border-radius: 999px;
  font-size: 20px;
  font-weight: 750;
  color: #0f172a;
  cursor: pointer;
  user-select: none;
  background: linear-gradient(135deg, #ffffff, #eef4ff);
  box-shadow: 0 12px 28px rgba(37, 99, 235, 0.18);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.dropdown-label:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 40px rgba(37, 99, 235, 0.24);
}

@media (max-width: 768px) {
  .nav-menu {
    padding: 0 18px;
  }

  .container-fluid[data-bootstrap-contains="containers"] {
    padding: 30px 0;
    align-items: flex-start;
  }

  .table-background {
    width: 92%;
    padding: 22px;
    border-radius: 24px;
  }

  .dropdown-label {
    width: 100%;
    justify-content: space-between;
    font-size: 18px;
    border-radius: 18px;
    padding: 13px 16px;
  }

  .dropdown-label.open .arrow {
    transform: rotate(180deg);
  }

  .profile-card {
    padding: 22px 18px;
    text-align: center;
  }

  .photo {
    width: 106px;
    height: 106px;
    margin-left: auto;
    margin-right: auto;
    border-radius: 50%;
  }

  .info {
    font-size: 14px;
  }

  .icons {
    justify-content: center;
  }
}

@media (max-width: 480px) {
	.info {
		font-size: 13px;
	}
	.info.active {
		padding: 0 20px;
	}
	.dropdown-label {
		font-size: 16px;
	}
}
</style>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const buttons = document.querySelectorAll(".language-selector button");
    let currentLang = localStorage.getItem('lang') || 'kk';

    function translatePage(lang) {
        document.querySelectorAll("[data-ru]").forEach(el => {
            if (lang === "ru") el.innerHTML = el.dataset.ru;
            if (lang === "kk") el.innerHTML = el.dataset.kk;
            if (lang === "en") el.innerHTML = el.dataset.en;
        });
    }

    translatePage(currentLang);

    buttons.forEach(button => {
        button.addEventListener("click", () => {
            currentLang = button.dataset.lang;
            localStorage.setItem('lang', currentLang);
            translatePage(currentLang);
        });
    });

    document.querySelectorAll('.toggleDropdown').forEach(item => {
        item.addEventListener('click', function () {
            const info = this.nextElementSibling;

            if (!info) return;

            info.classList.toggle('active');
            this.classList.toggle('open');
        });
    });
});
</script>
{% endblock %}
